name: Java 25 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B clean verify
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
        env:
          PYTHONPATH: tools
