# 语言文件 - 迷宫行者 (The Maze Runner)
# 版本: 1.0

prefix: "&8[&e迷宫行者&8] &r"

classes:
  runner:
    name: "&b行者"
    description:
      - "&7我们需要跑得更快."
      - "&7专属能力: &f速度 I, 跳跃提升 I"
  guardian:
    name: "&c守护者"
    description:
      - "&7保护你的队友."
      - "&7专属能力: &f抗性提升 I, 额外生命值"
  medjack:
    name: "&d医疗兵"
    description:
      - "&7战场上的希望."
      - "&7专属能力: &f治疗药水, 生命恢复"
  builder:
    name: "&a建筑师"
    description:
      - "&7建造防御工事."
      - "&7专属能力: &f方块, 挖掘速度提升"
